<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetList</title>

  <!-- Font & ikon -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- CSS terpisah -->
  <link rel="stylesheet" href="home.css">
</head>
<body>

  <!-- ===== NAVBAR ===== -->
  <header class="navbar">
    <a href="home.html" class="logo">Net<span class="accent">List</span></a>

    <nav class="menu">
      <a href="home.html">Home</a>
      <a href="#">Movies</a>
      <a href="#">Series</a>
      <a href="#">WatchList</a>
    </nav>

    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="search-input" placeholder="Search movies...">
    </div>

    <a href="#" class="profile"><i class="fa-regular fa-circle-user"></i></a>
  </header>

  <!-- ===== HERO (banner film) ===== -->
  <section class="hero" id="hero">
    <button class="arrow arrow-left" id="btn-prev" aria-label="Sebelumnya">
      <i class="fa-solid fa-arrow-left"></i>
    </button>

    <div class="hero-info">
      <h1 id="hero-title">Loading...</h1>

      <p class="hero-meta">
        <i class="fa-solid fa-star star"></i>
        <span id="hero-rating">-</span>
        <span id="hero-detail"></span>
      </p>

      <p class="hero-desc" id="hero-desc"></p>

      <div class="hero-buttons">
        <button class="btn-trailer" id="btn-trailer">
          <i class="fa-solid fa-play"></i> Trailer
        </button>
        <button class="btn-watchlist" id="btn-hero-watchlist">
          <i class="fa-regular fa-bookmark"></i> WatchList
        </button>
      </div>
    </div>

    <button class="arrow arrow-right" id="btn-next" aria-label="Berikutnya">
      <i class="fa-solid fa-arrow-right"></i>
    </button>
  </section>

  <!-- ===== DAFTAR FILM ===== -->
  <section class="movies">
    <h2 class="section-title" id="section-title">Popular Horror</h2>
    <div class="movie-grid" id="movie-grid"></div>
  </section>

  <!-- JavaScript terpisah -->
  <script src="home.js"></script>
</body>
</html>
