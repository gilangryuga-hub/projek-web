<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar - FilmZone</title>

  <!-- Font & ikon -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- CSS terpisah -->
  <link rel="stylesheet" href="register.css">
</head>
<body>

  <!-- Pembungkus halaman: berisi background & menempatkan kartu di tengah -->
  <div class="page">

    <!-- Kartu register -->
    <section class="register-card">
      <h1 class="register-title">Create your account</h1>
      <p class="register-subtitle">
        Bergabunglah dengan FilmZone dan nikmati<br>
        pengalaman menonton film yang lebih seru
      </p>

      <form action="#" method="post">

        <!-- Nama lengkap -->
        <div class="input-group">
          <i class="fa-regular fa-user icon-left"></i>
          <input type="text" name="nama" placeholder="Nama lengkap" required>
        </div>

        <!-- Email -->
        <div class="input-group">
          <i class="fa-regular fa-envelope icon-left"></i>
          <input type="email" name="email" placeholder="Email" required>
        </div>

        <!-- Password -->
        <div class="input-group">
          <i class="fa-solid fa-lock icon-left"></i>
          <input type="password" name="password" placeholder="Password" required>
          <i class="fa-regular fa-eye-slash icon-right"></i>
        </div>

        <!-- Konfirmasi password -->
        <div class="input-group">
          <i class="fa-solid fa-lock icon-left"></i>
          <input type="password" name="konfirmasi" placeholder="Konfirmasi password" required>
          <i class="fa-regular fa-eye-slash icon-right"></i>
        </div>

        <button type="submit" class="btn-register">Daftar</button>
      </form>

      <!-- Pembatas "atau" -->
      <div class="divider"><span>atau</span></div>

      <!-- Tombol sosial -->
      <button type="button" class="btn-social">
        <svg width="26" height="26" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2045c0-.638-.0573-1.2518-.1636-1.8409H9v3.4814h4.8436c-.2086 1.125-.8427 2.0782-1.7959 2.7164v2.2581h2.9087c1.7018-1.5668 2.6836-3.874 2.6836-6.615z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.4673-.8059 5.9564-2.1805l-2.9087-2.2581c-.8059.54-1.8368.859-3.0477.859-2.344 0-4.3282-1.5831-5.036-3.7104H.9574v2.3318C2.4382 15.9832 5.4818 18 9 18z"/>
          <path fill="#FBBC05" d="M3.964 10.71c-.18-.54-.2822-1.1168-.2822-1.71s.1023-1.17.2823-1.71V4.9582H.9573A8.9965 8.9965 0 0 0 0 9c0 1.4523.3477 2.8268.9573 4.0418L3.964 10.71z"/>
          <path fill="#EA4335" d="M9 3.5795c1.3214 0 2.5077.4541 3.4405 1.346l2.5813-2.5814C13.4632.8918 11.426 0 9 0 5.4818 0 2.4382 2.0168.9573 4.9582L3.964 7.29C4.6718 5.1627 6.6559 3.5795 9 3.5795z"/>
        </svg>
        <span>Masuk dengan Google</span>
      </button>

      <button type="button" class="btn-social">
        <i class="fa-brands fa-apple"></i>
        <span>Masuk dengan Apple</span>
      </button>
    </section>

  </div>
</body>
</html>
